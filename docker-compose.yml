services:
  oblivion:
    image: ghcr.io/hooteo/oblivion:latest
    build: .   # "docker compose pull" usa l'immagine di GitHub, "up --build" la costruisce in locale
    container_name: oblivion
    restart: unless-stopped
    ports:
      - "8095:8000"
    environment:
      TZ: Europe/Rome
      # PUID: 1000   # utente con cui gira l'app (proprietario della cartella dati)
      # PGID: 1000
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?imposta DASHBOARD_PASSWORD nel file .env}
      # SECRET_KEY: chiave Fernet per cifrare le password SMTP/IMAP.
      # Se manca viene generata in /data/secret.key (allora fai il backup di tutta la cartella).
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - ./state:/data   # database, chiave e password: e' la cartella da salvare nei backup
